<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>全月通・一按即慳 | MTR Monthly Pass Optimizer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Language toggle button -->
  <button id="langToggle">🌐</button>

  <!-- Portrait container wrapper -->
  <div class="portrait-container">
    <div class="container">
      <h1 id="appTitle">全月通・一按即慳</h1>
      <p id="appSubtitle" class="app-subtitle">出閘再入閘，搵出至抵搭法</p>

      <!-- From: line + station on one row -->
      <div class="row two-cols">
        <div class="field">
          <label for="fromLine">From Line:</label>
          <select id="fromLine"></select>
        </div>
        <div class="field">
          <label for="fromStation">From Station:</label>
          <select id="fromStation"></select>
        </div>
      </div>

      <!-- To: line + station on one row -->
      <div class="row two-cols">
        <div class="field">
          <label for="toLine">To Line:</label>
          <select id="toLine"></select>
        </div>
        <div class="field">
          <label for="toStation">To Station:</label>
          <select id="toStation"></select>
        </div>
      </div>

      <fieldset class="pass-toggle-group">
        <legend id="passToggleLegend">Monthly passes</legend>
        <div id="passToggles" class="pass-toggles"></div>
        <button id="toggleAllPasses" class="toggle-all-passes" type="button">Toggle all</button>
      </fieldset>

      <button onclick="calculateFare()">Calculate</button>

      <div class="table-wrapper">
        <div id="mobileFareResults" class="mobile-fare-results" aria-live="polite"></div>
        <table id="resultTable" style="display:none;">
          <thead></thead>
          <tbody></tbody>
        </table>
        <section id="routeTable" class="route-table" aria-live="polite" hidden>
          <h2 id="routeTableTitle"></h2>
          <div id="routeChoices" class="route-choices" role="group" aria-label="Route suggestions"></div>
          <div id="routeDiagram" class="route-diagram-scroll"></div>
        </section>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <!-- Cloudflare Web Analytics -->
  <script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "b554cf13a4a4411da072d2fa09cd49b8"}'></script>
  <!-- End Cloudflare Web Analytics -->
</body>
</html>
