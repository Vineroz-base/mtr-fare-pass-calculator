<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MTR Fare Calculator (全月通)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Language toggle button -->
  <button id="langToggle">🌐</button>

  <!-- Portrait container wrapper -->
  <div class="portrait-container">
    <div class="container">
      <h1>MTR Fare Calculator (全月通)</h1>

      <!-- From: line + station on one row -->
      <div class="row two-cols">
        <div class="field">
          <label for="fromLine">From Line:</label>
          <select id="fromLine"></select>
        </div>
        <div class="field">
          <label for="fromStation">From Station:</label>
          <select id="fromStation"></select>
        </div>
      </div>

      <!-- To: line + station on one row -->
      <div class="row two-cols">
        <div class="field">
          <label for="toLine">To Line:</label>
          <select id="toLine"></select>
        </div>
        <div class="field">
          <label for="toStation">To Station:</label>
          <select id="toStation"></select>
        </div>
      </div>

      <!-- Monthly Pass -->
      <div class="row">
        <div class="field">
          <label for="monthlyPass">Monthly Pass:</label>
          <select id="monthlyPass">
            <option value="Pass1">Sheung Shui/Wu Kai Sha ↔ East Tsim Sha Tsui</option>
            <option value="Pass2">Tuen Mun ↔ Nam Cheong</option>
            <option value="Pass3">Tuen Mun ↔ Hung Hom</option>
            <option value="Pass4">Tung Chung ↔ Nam Cheong</option>
            <option value="Pass5">Tung Chung ↔ Hong Kong</option>
          </select>
        </div>
      </div>

      <button onclick="calculateFare()">Calculate</button>

      <div class="table-wrapper">
        <table id="resultTable" style="display:none;">
          <thead id="resultHeaders">
            <tr><th></th><th id="bestFareHeader"></th></tr>
          </thead>
          <tbody>
            <tr><th id="fareWithPassLabel" class="highlight" scope="row">Fare with Pass:</th><td id="passFare"></td></tr>
            <tr><th id="originalFareLabel" scope="row">Original Fare:</th><td id="originalFare"></td></tr>
            <tr><th id="differenceLabel" scope="row">Difference:</th><td id="difference"></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
