<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 512 512">

  <!-- ==========================================
       V9.0-K  Kowloon boundary corridor
       Pass set shown: MP1 + MP2 + MP4
         Solid : TML Tuen Mun side -> Nam Cheong (MP2)
                 TCL Tung Chung side -> Nam Cheong (MP4)
                 TML East TST -> Kai Tak side (MP1)
                 ERL north -> Hung Hom (MP1)
         Faded : TML Nam Cheong -> Austin -> East TST
                 (gap = connecting journey)
                 TCL Nam Cheong -> Hong Kong side
                 ERL Hung Hom -> Admiralty side
       Stroke 34; touching parallels 34 apart
       All bends are true circular arcs
       ========================================== -->

  <defs>
    <clipPath id="iconClip">
      <rect width="512" height="512" rx="88"/>
    </clipPath>
  </defs>

  <g clip-path="url(#iconClip)">

    <rect width="512" height="512" fill="#F7F7F3"/>

    <!-- OUT OF PASS (FADED) -->
    <g opacity="0.3" fill="none" stroke-width="34"
       stroke-linecap="round" stroke-linejoin="round">

      <!-- TCL: Nam Cheong -> Olympic -> off bottom -->
      <path d="M 136 236 V 540" stroke="#F7941D"/>

      <!-- ERL: Hung Hom -> Exhibition Centre side -->
      <path d="M 360 370
               V 400
               A 60 60 0 0 1 342.43 442.43
               L 270 514.86"
            stroke="#5EB6E4"/>

      <!-- TML: Nam Cheong -> Austin -> East TST -->
      <path d="M 170 236
               V 270
               A 60 60 0 0 0 187.57 312.43
               L 227.57 352.43
               A 60 60 0 0 0 270 370"
            stroke="#9B3F13"/>
    </g>

    <!-- COVERED (SOLID) -->
    <g fill="none" stroke-width="34"
       stroke-linecap="round" stroke-linejoin="round">

      <!-- TCL: Tsing Yi side -> Lai King -> Nam Cheong
           Inner curve concentric with TML (centre 100,166) -->
      <path d="M -20 203.44
               L 41.72 141.72
               A 40 40 0 0 1 70 130
               H 100
               A 36 36 0 0 1 136 166
               V 236"
            stroke="#F7941D"/>

      <!-- TML west: Mei Foo side -> Nam Cheong -->
      <path d="M -20 96
               H 100
               A 70 70 0 0 1 170 166
               V 236"
            stroke="#9B3F13"/>

      <!-- ERL: Mong Kok East side -> Hung Hom -->
      <path d="M 360 -20 V 370" stroke="#5EB6E4"/>

      <!-- TML east: East TST -> Hung Hom -> Kai Tak side -->
      <path d="M 270 370
               H 390
               A 60 60 0 0 0 432.43 352.43
               L 540 244.86"
            stroke="#9B3F13"/>
    </g>

    <!-- STATIONS -->

    <!-- Nam Cheong: TCL x=136 + TML x=170, y=236 -->
    <rect x="114" y="214" width="78" height="44" rx="22"
          fill="#FFFFFF" stroke="#183454" stroke-width="8"/>

    <!-- East Tsim Sha Tsui -->
    <circle cx="270" cy="370" r="18"
            fill="#FFFFFF" stroke="#183454" stroke-width="8"/>

    <!-- Hung Hom: ERL x=360 crosses TML y=370 -->
    <rect x="338" y="335" width="44" height="70" rx="22"
          fill="#FFFFFF" stroke="#183454" stroke-width="8"/>
  </g>

</svg>
